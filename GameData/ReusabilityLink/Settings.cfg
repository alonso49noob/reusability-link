// Reusability Link — configuración
// Los decimales usan PUNTO (0.5), no coma. Un valor inválido se ignora y se usa el de por defecto (ver KSP.log).
REUSABILITY_LINK
{
	// Número máximo de naves seguidas a la vez (incluida la activa)
	MaxTrackedVessels = 2
	// Seguir automáticamente las etapas que se separan durante el ascenso
	AutoTrack = True
	// El seguimiento automático exige que la etapa tenga motores
	AutoTrackRequireEngines = True
	// Presión dinámica (Pa) a partir de la cual la nave inactiva pasa a física completa
	PhysicsOnDynamicPressure = 100
	// Presión dinámica (Pa) por debajo de la cual puede volver a raíles
	RailsBelowDynamicPressure = 50
	// Segundos seguidos por debajo del umbral anterior antes de volver a raíles
	RailsHoldSeconds = 5
	// Segundos de previsión: se activa la física antes de llegar al aire denso
	LookaheadSeconds = 15
	// Distancia máxima (m) a la nave activa para mantener física; más lejos queda en raíles con aviso
	MaxPhysicsDistance = 300000
	// Por debajo de esta distancia (m) la nave inactiva siempre tiene física, como en KSP normal
	RailsMinDistance = 2500
	// Presión estática (kPa) por encima de la cual la nave inactiva nunca va en raíles
	RailsMaxStaticPressureKPa = 1.0
	// Velocidad (m/s) por debajo de la cual una nave aterrizada se considera quieta
	LandedSettleSpeed = 0.5
	// Segundos quieta tras aterrizar para terminar el seguimiento
	LandedSettleSeconds = 10
	// Aviso amarillo de impacto (segundos)
	ImpactWarnSeconds = 60
	// Aviso rojo de impacto (segundos)
	ImpactCriticalSeconds = 20
	// Tecla para cambiar de nave (modificadores: Alt, Ctrl, Shift). KSP ignora los modificadores en sus
	// propias teclas: elige una letra que KSP no use (Alt+B, por ejemplo, también activaría los frenos)
	SwitchKey = Alt+Y
}
